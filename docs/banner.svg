<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="YatraSetu AI – multilingual, voice-enabled safe-travel assistant for Uttarakhand">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2129"/><stop offset=".55" stop-color="#1f4e5f"/><stop offset="1" stop-color="#d9731e"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe2a8"/><stop offset=".45" stop-color="#f2b450" stop-opacity=".85"/><stop offset="1" stop-color="#f2b450" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffe2a8"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fbfc"/><stop offset="1" stop-color="#9db7c0"/>
    </linearGradient>
    <style>
      .float1 { animation: f 6s ease-in-out infinite; }
      .float2 { animation: f 7s ease-in-out -2s infinite; }
      .float3 { animation: f 6.5s ease-in-out -4s infinite; }
      .glow { animation: g 5s ease-in-out infinite; transform-origin: 930px 250px; }
      .star { animation: tw 3s ease-in-out infinite; }
      .s2 { animation-delay: -1s; } .s3 { animation-delay: -2s; }
      .chip text { font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #fff; }
      .chip small, .chip .sub { font: 400 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: rgba(255,255,255,.8); }
      @keyframes f { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
      @keyframes g { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.08); opacity: 1; } }
      @keyframes tw { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="380" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#fff">
    <circle class="star" cx="80" cy="40" r="1.6"/><circle class="star s2" cx="210" cy="70" r="1.2"/><circle class="star s3" cx="360" cy="30" r="1.5"/>
    <circle class="star s2" cx="520" cy="55" r="1.1"/><circle class="star" cx="700" cy="35" r="1.4"/><circle class="star s3" cx="1080" cy="50" r="1.3"/>
    <circle class="star s2" cx="1150" cy="95" r="1"/><circle class="star" cx="620" cy="95" r="1"/>
  </g>
  <!-- sun -->
  <circle class="glow" cx="930" cy="250" r="150" fill="url(#sun)"/>

  <!-- far ridge with snow caps -->
  <path d="M0 300 L90 230 L160 260 L260 170 L340 235 L430 190 L520 250 L610 160 L700 230 L800 150 L880 215 L960 175 L1050 240 L1130 190 L1200 225 L1200 380 L0 380 Z" fill="#2a6377" opacity=".85"/>
  <path d="M260 170 L285 192 L272 190 L262 200 L248 188 Z M610 160 L640 186 L625 183 L612 195 L596 182 Z M800 150 L832 178 L815 175 L803 188 L786 173 Z" fill="url(#snow)"/>
  <!-- temple silhouette (stylised shikhara) -->
  <g fill="#143a46" transform="translate(905 196)">
    <rect x="-34" y="70" width="68" height="44"/>
    <path d="M-26 70 L-20 22 Q0 -14 20 22 L26 70 Z"/>
    <path d="M-6 -10 L0 -34 L6 -10 Z"/>
    <rect x="-1.2" y="-52" width="2.4" height="22"/>
    <path d="M1.2 -52 L18 -46 L1.2 -40 Z" fill="#d9731e"/>
    <rect x="-46" y="104" width="92" height="12"/>
  </g>
  <!-- near ridge -->
  <path d="M0 330 L120 280 L210 315 L330 260 L450 320 L560 285 L690 330 L800 275 L930 312 L1040 280 L1170 325 L1200 310 L1200 380 L0 380 Z" fill="#0e2a33"/>

  <!-- logo + title -->
  <g transform="translate(64 92)">
    <rect width="64" height="64" rx="16" fill="#d9731e"/>
    <rect width="64" height="64" rx="16" fill="#f2b450" opacity=".35"/>
    <text x="32" y="43" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#fff">YS</text>
  </g>
  <text x="148" y="140" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="56" font-weight="800" fill="url(#title)" letter-spacing="-1">YatraSetu AI</text>
  <text x="66" y="194" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" fill="#e6eff1">Multilingual, voice-enabled safe-travel &amp; crowd advisory assistant</text>
  <text x="66" y="224" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="17" fill="#ffd9ad">Char Dham · Hemkund Sahib · उत्तराखंड यात्रा</text>

  <!-- floating chips -->
  <g transform="translate(66 252)"><g class="chip float1">
    <rect width="196" height="46" rx="14" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".3"/>
    <text x="16" y="29">🗣️  Voice · हिन्दी / English</text>
  </g></g>
  <g transform="translate(276 252)"><g class="chip float2">
    <rect width="196" height="46" rx="14" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".3"/>
    <text x="16" y="29">📈  7-day crowd forecast</text>
  </g></g>
  <g transform="translate(486 252)"><g class="chip float3">
    <rect width="156" height="46" rx="14" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".3"/>
    <text x="16" y="29">🛣️  Live route risk</text>
  </g></g>
</svg>
